  const soalKosong = () => ({ pertanyaan: '', opsi: { A: '', B: '', C: '', D: '' }, kunci: '', bobot: 10, pembahasan: '' });
  function gambarEditor(box) {
    const L = latDraft.latihan, S = latDraft.soal;
    box.innerHTML = '<div class="card panel"><div class="panel-h"><h2>' + ic('pencil', 20) + ' ' + (L.id ? 'Ubah Latihan' : 'Latihan Baru') + '</h2>' + (L.id ? '<span class="pill ' + (L.status === 'Terbit' ? 'pill-green' : 'pill-amber') + '">' + esc(L.status) + '</span>' : '') + '</div>' +
      '<div class="stack">' + fld('eJudul', 'Judul latihan *', inp('eJudul', L.judul, 'placeholder="Latihan Soal: Trigonometri Dasar"')) +

      '<div class="grid-2">' + fld('eDur', 'Durasi (menit)', inp('eDur', L.durasi, 'type="number" min="0" max="300"'), '0 = tanpa batas waktu') + fld('eKkm', 'KKM', inp('eKkm', L.kkm || '', 'type="number" min="1" max="100" placeholder="' + esc((M.app && M.app.kkm) || 75) + '"'), 'Kosong = KKM umum di Pengaturan') + '</div></div></div>' +
      '<div class="row between" style="margin:20px 0 12px"><h2 style="font-size:18px">Soal (' + S.length + ')</h2><button class="btn btn-outline btn-sm" id="eTempel">' + ic('copy', 16) + ' Tempel dari teks</button></div>' +
      '<div id="eSoal">' + S.map((s, i) => blokSoal(s, i)).join('') + '</div>' +
      '<button class="btn btn-outline btn-block" id="eTambah" style="margin-top:12px">' + ic('plus', 18) + ' Tambah Soal</button>' +
      '<div class="card sticky-foot" style="margin-top:16px;border-radius:14px">' + (L.id ? '<button class="btn btn-danger-outline" id="eHapus">' + ic('trash', 18) + ' Hapus</button>' : '') + '<span class="grow small muted" id="eInfo"></span>' +
        '<button class="btn btn-outline" id="eDraf">' + ic('save', 18) + ' Simpan Draf</button><button class="btn btn-primary" id="eTerbit">' + ic('send', 18) + ' ' + (L.status === 'Terbit' ? 'Simpan & Terbitkan' : 'Terbitkan') + '</button></div>';
    const tandai = () => { latKotor = true; box.querySelector('#eInfo').textContent = 'Ada perubahan belum disimpan'; };
    const ambilMeta = () => { const v = (id) => box.querySelector('#' + id).value.trim(); Object.assign(L, { judul: v('eJudul'), mapelId: v('eMapel'), kelasId: v('eKelas'), bab: v('eBab'), durasi: v('eDur'), kkm: v('eKkm') }); };
    box.querySelectorAll('#eJudul,#eMapel,#eKelas,#eBab,#eDur,#eKkm').forEach((el) => el.addEventListener('input', () => { ambilMeta(); tandai(); }));
    const pasangSoal = () => {
      box.querySelectorAll('.qb').forEach((q) => {
        const i = +q.dataset.i, s = S[i];
        q.querySelector('[data-f=p]').addEventListener('input', (e) => { s.pertanyaan = e.target.value; tandai(); });
        q.querySelector('[data-f=b]').addEventListener('input', (e) => { s.bobot = e.target.value; tandai(); });
        q.querySelector('[data-f=pb]').addEventListener('input', (e) => { s.pembahasan = e.target.value; tandai(); });
        q.querySelectorAll('[data-o]').forEach((o) => o.addEventListener('input', (e) => { s.opsi[o.dataset.o] = e.target.value; tandai(); }));
        q.querySelectorAll('[data-key]').forEach((k) => k.addEventListener('click', () => { s.kunci = k.dataset.key; q.querySelectorAll('[data-key]').forEach((x) => { x.classList.toggle('on', x === k); x.setAttribute('aria-pressed', x === k); }); tandai(); }));
        q.querySelector('[data-del]').addEventListener('click', () => { if (S.length === 1) return toast('Minimal satu soal.', 'warning'); S.splice(i, 1); ambilMeta(); gambarEditor(box); tandai(); });
      });
    };
    pasangSoal();
    box.querySelector('#eTambah').addEventListener('click', () => { ambilMeta(); S.push(soalKosong()); gambarEditor(box); tandai(); setTimeout(() => { const last = box.querySelector('.qb:last-child textarea'); if (last) { last.focus(); last.scrollIntoView({ block: 'center' }); } }, 50); });
    box.querySelector('#eTempel').addEventListener('click', () => tempelSoal(box));
    const simpan = async (status, btn) => {
      ambilMeta();
      const kosong = S.findIndex((s) => !s.pertanyaan.trim() && !s.kunci && !Object.values(s.opsi).some((x) => x.trim()));
      const soal = S.filter((s, i) => !(i === kosong && S.length > 1));
      tombolSibuk(btn, true);
      const r = await API.tulis('latihan.simpan', { latihan: Object.assign({}, L, { status }), soal });
      tombolSibuk(btn, false);
      if (!r.success) return toast(r.message, 'error');

      toast(r.message, 'success');
      latihan();
    };
    box.querySelector('#eDraf').addEventListener('click', (e) => simpan(L.status === 'Terbit' ? 'Terbit' : 'Draf', e.currentTarget));
    box.querySelector('#eTerbit').addEventListener('click', (e) => simpan('Terbit', e.currentTarget));
    const h = box.querySelector('#eHapus');
    if (h) h.addEventListener('click', async () => {

  function blokSoal(s, i) {
    return '<div class="qb" data-i="' + i + '"><div class="row" style="align-items:flex-start;gap:10px"><span class="no">' + (i + 1) + '</span><div class="grow stack">' +
      '<textarea class="textarea" data-f="p" rows="2" placeholder="Tulis pertanyaan…" aria-label="Pertanyaan soal ' + (i + 1) + '">' + esc(s.pertanyaan) + '</textarea>' +
      ['A', 'B', 'C', 'D'].map((k) => '<div class="opt-in"><button type="button" class="key' + (s.kunci === k ? ' on' : '') + '" data-key="' + k + '" aria-pressed="' + (s.kunci === k) + '" title="Jadikan kunci jawaban" aria-label="Jadikan ' + k + ' kunci jawaban">' + k + '</button><input class="input" data-o="' + k + '" value="' + esc(s.opsi[k]) + '" placeholder="Pilihan ' + k + '" aria-label="Pilihan ' + k + ' soal ' + (i + 1) + '"></div>').join('') +
      '<div class="grid-2" style="grid-template-columns:120px 1fr"><input class="input" data-f="b" type="number" min="1" max="100" value="' + esc(s.bobot) + '" aria-label="Bobot poin" title="Bobot poin"><input class="input" data-f="pb" value="' + esc(s.pembahasan || '') + '" placeholder="Pembahasan (tampil setelah siswa mengirim)"></div>' +
      '<p class="xs muted">Klik huruf berwarna hijau untuk menandai kunci jawaban. Bobot = poin soal.</p></div>' +
      '<button type="button" class="btn btn-ghost btn-icon btn-sm" data-del aria-label="Hapus soal ' + (i + 1) + '" style="color:var(--danger)">' + ic('trash', 18) + '</button></div></div>';
  }
  function tempelSoal(box) {
    const d = UI.buka(UI.headHtml('Tempel soal dari teks', 'Cocok untuk menyalin soal dari Word / Google Docs.') + '<div class="modal-body stack">' +
      '<div class="info-box">' + ic('info', 18) + '<span>Format per soal:<br><code>1. Pertanyaan…<br>A. pilihan<br>B. pilihan<br>C. pilihan<br>D. pilihan<br>Kunci: B</code><br>Baris “Pembahasan: …” opsional.</span></div>' +
      '<textarea class="textarea" id="tTeks" rows="12" placeholder="Tempel soal di sini…"></textarea></div><div class="modal-foot"><button class="btn btn-outline" data-close>Batal</button><button class="btn btn-primary" id="tOk">' + ic('plus', 18) + ' Tambahkan</button></div>', { wide: true });
    d.el.querySelector('#tOk').addEventListener('click', () => {
      const blok = d.el.querySelector('#tTeks').value.replace(/\r/g, '').split(/\n(?=\s*\d+[.)]\s)/).map((b) => b.trim()).filter(Boolean);
      const hasil = [];
      blok.forEach((b) => {
        const s = soalKosong(); const baris = b.split('\n'); const tanya = [];
        baris.forEach((ln) => {
          const t = ln.trim(); let m;
          if ((m = t.match(/^([A-Da-d])[.)]\s*(.*)$/))) s.opsi[m[1].toUpperCase()] = m[2];
          else if ((m = t.match(/^kunci\s*(jawaban)?\s*[:=]\s*([A-Da-d])/i))) s.kunci = m[2].toUpperCase();
          else if ((m = t.match(/^pembahasan\s*[:=]\s*(.*)$/i))) s.pembahasan = m[1];
          else tanya.push(t.replace(/^\d+[.)]\s*/, ''));
        });
        s.pertanyaan = tanya.join('\n').trim();
        if (s.pertanyaan) hasil.push(s);
      });
      if (!hasil.length) return toast('Tidak ada soal yang terbaca. Periksa formatnya.', 'error');
      const S = latDraft.soal;
      if (S.length === 1 && !S[0].pertanyaan) S.splice(0, 1);
      hasil.forEach((s) => S.push(s));
      d.tutup(); latKotor = true; gambarEditor(box);
      const tanpaKunci = hasil.filter((s) => !s.kunci).length;
      toast(hasil.length + ' soal ditambahkan' + (tanpaKunci ? '. ' + tanpaKunci + ' soal belum punya kunci jawaban.' : '.'), tanpaKunci ? 'warning' : 'success');
    });
  }

  <script>
/* ==================================================================
   Syarifah Course — Efek interaktif halaman masuk
   - Maskot burung hantu: mata mengikuti kursor/ketikan, menutup mata saat
     kata sandi diisi, mengintip saat sandi ditampilkan, sedih saat gagal,
     melompat saat berhasil. Pakai kacamata saat mode Guru.
   - Jaringan partikel (canvas) yang bereaksi pada kursor.
   - Teks mengetik (typewriter), parallax kartu melayang, sorot kartu,
     riak tombol, dan konfeti.
   Semua efek berhenti sendiri saat layar login ditinggalkan dan
   menghormati prefers-reduced-motion.
   ================================================================== */
(function () {
  'use strict';
  const kurangGerak = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pakaiMouse = () => window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
  const batas = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------------- Maskot ----------------
  function owlSvg() {
    return '<div class="owl-wrap" aria-hidden="true"><svg class="owl" viewBox="0 0 140 124" focusable="false">' +
      '<g class="ow-tilt"><g class="ow-napas"><g class="ow-all">' +
        '<path class="ow-b" d="M36 48 L14 22 L50 36 Z"/><path class="ow-b" d="M104 48 L126 22 L90 36 Z"/>' +
        '<ellipse class="ow-b" cx="70" cy="80" rx="54" ry="46"/>' +
        '<ellipse class="ow-belly" cx="70" cy="108" rx="30" ry="22"/>' +
        '<path class="ow-f" d="M57 102 q4 4 8 0 M69 102 q4 4 8 0 M63 112 q4 4 8 0 M75 112 q4 4 8 0"/>' +
        '<path class="ow-face" d="M70 54 C52 38 18 50 22 76 C26 98 56 100 70 88 C84 100 114 98 118 76 C122 50 88 38 70 54 Z"/>' +
        '<ellipse class="ow-pipi" cx="33" cy="90" rx="7" ry="4"/><ellipse class="ow-pipi" cx="107" cy="90" rx="7" ry="4"/>' +
        '<g class="ow-eye"><circle class="ow-sclera" cx="50" cy="72" r="16"/><g class="ow-pupil"><circle cx="50" cy="72" r="8"/><circle class="ow-kilau" cx="53" cy="69" r="2.6"/></g></g>' +
        '<g class="ow-eye"><circle class="ow-sclera" cx="90" cy="72" r="16"/><g class="ow-pupil"><circle cx="90" cy="72" r="8"/><circle class="ow-kilau" cx="93" cy="69" r="2.6"/></g></g>' +
        '<g class="ow-happy"><path d="M38 75 q12 -13 24 0"/><path d="M78 75 q12 -13 24 0"/></g>' +
        '<g class="ow-alis"><path d="M35 56 L60 50"/><path d="M105 56 L80 50"/></g>' +
        '<g class="ow-kacamata"><circle cx="50" cy="72" r="20"/><circle cx="90" cy="72" r="20"/><path d="M68 68 Q70 64 72 68"/></g>' +
        '<path class="ow-paruh" d="M63 86 L77 86 L70 98 Z"/>' +
        '<g class="ow-topi"><path class="ow-topi-a" d="M44 38 L44 28 Q70 36 96 28 L96 38 Q70 46 44 38 Z"/>' +
          '<path class="ow-topi-b" d="M70 6 L120 22 L70 38 L20 22 Z"/><circle class="ow-topi-k" cx="70" cy="22" r="3"/>' +
          '<g class="ow-rumbai"><path d="M70 22 L106 30 L106 44"/><rect x="102" y="43" width="8" height="11" rx="2"/></g></g>' +
        '<ellipse class="ow-sayap ow-sl" cx="19" cy="98" rx="17" ry="26"/><ellipse class="ow-sayap ow-sr" cx="121" cy="98" rx="17" ry="26"/>' +
      '</g></g></g></svg></div>';
  }

  function maskot(root) {
    const wrap = root.querySelector('.owl-wrap'), svg = root.querySelector('.owl');
    if (!svg) return null;
    const tilt = svg.querySelector('.ow-tilt'), pupils = svg.querySelectorAll('.ow-pupil');
    const user = () => root.querySelector('#lUser'), pass = root.querySelector('#lPass');
    let fokus = null, timer = [];
    const hidup = () => svg.isConnected;
    const lihat = (dx, dy) => {
      pupils.forEach((p) => { p.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)'; });
      tilt.style.transform = 'rotate(' + (dx * .7).toFixed(2) + 'deg)';
    };
    const ikutKetikan = () => {
      const u = user(); if (!u) return;
      const panjang = (u.value || '').length;
      lihat(-6 + 12 * Math.min(1, panjang / 26), 5);
    };
    const status = () => {
      const tutup = fokus === 'pass';
      svg.classList.toggle('tutup', tutup);
      svg.classList.toggle('intip', tutup && pass.type === 'text');
      if (fokus === 'user') ikutKetikan();
      else if (!tutup) lihat(0, 2);
    };
    // kursor (desktop)
    const onMove = (e) => {
      if (!hidup()) { window.removeEventListener('pointermove', onMove); return; }
      if (e.pointerType !== 'mouse' || fokus) return;
      const r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .58;
      const vx = e.clientX - cx, vy = e.clientY - cy, d = Math.hypot(vx, vy) || 1, k = Math.min(6, d / 40);
      lihat(vx / d * k, vy / d * k);
    };
    window.addEventListener('pointermove', onMove, { passive: true });
    root.addEventListener('focusin', (e) => {
      if (e.target.id === 'lUser') fokus = 'user';
      else if (e.target.id === 'lPass') fokus = 'pass';
      else if (e.target.dataset && e.target.dataset.mata === 'lPass') fokus = 'pass';
      else fokus = null;
      status();
    });
    root.addEventListener('focusout', () => setTimeout(() => { if (!root.contains(document.activeElement)) { fokus = null; status(); } }, 0));
    root.addEventListener('input', (e) => { if (e.target.id === 'lUser') ikutKetikan(); });
    root.addEventListener('keyup', (e) => { if (e.target.id === 'lUser') ikutKetikan(); });
    // tombol mata (pasangMata sudah terpasang lebih dulu → tipe input sudah berubah di sini)
    const mata = root.querySelector('[data-mata="lPass"]');
    if (mata) mata.addEventListener('click', () => { fokus = 'pass'; status(); });
    // berkedip & melirik saat diam
    const kedip = () => {
      if (!hidup()) return;
      if (!svg.classList.contains('tutup') && !svg.classList.contains('senang')) {
        svg.classList.add('kedip'); setTimeout(() => svg.classList.remove('kedip'), 140);
      }
      timer.push(setTimeout(kedip, 2400 + Math.random() * 3200));
    };
    const lirik = () => {
      if (!hidup()) return;
      if (!fokus && !pakaiMouse()) lihat((Math.random() - .5) * 10, (Math.random() - .3) * 6);
      timer.push(setTimeout(lirik, 2600 + Math.random() * 2400));
    };
    if (!kurangGerak()) { timer.push(setTimeout(kedip, 1800)); timer.push(setTimeout(lirik, 3000)); }
    // ketuk maskot → melompat
    wrap.addEventListener('click', () => api.senang(900));
    const sekali = (cls, ms) => { svg.classList.remove(cls); void svg.getBoundingClientRect(); svg.classList.add(cls); setTimeout(() => svg.classList.remove(cls), ms); };
    const api = {
      peran(p) { svg.classList.toggle('guru', p === 'guru'); },
      senang(ms) { sekali('senang', ms || 1400); },
      sedih() { sekali('sedih', 1700); },
      reset() { fokus = null; status(); }
    };
    lihat(0, 2);
    return api;
  }

  // ---------------- Jaringan partikel ----------------
  function jaring(canvas) {
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext('2d'), host = canvas.parentElement;
    let w = 0, h = 0, pts = [], mx = -9999, my = -9999;
    const ukur = () => {
      const r = host.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      w = r.width; h = r.height; canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(batas(w * h / 16000, 22, 70));
      while (pts.length < n) pts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .32, vy: (Math.random() - .5) * .32, r: Math.random() * 1.5 + .7 });
      pts.length = n;
      pts.forEach((p) => { p.x = Math.min(p.x, w); p.y = Math.min(p.y, h); });
    };
    const gambar = () => {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i];
        for (let j = i + 1; j < pts.length; j++) {
          const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 118) { ctx.strokeStyle = 'rgba(147,197,253,' + (.26 * (1 - d / 118)).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        }
        const dm = Math.hypot(a.x - mx, a.y - my);
        if (dm < 170) { ctx.strokeStyle = 'rgba(74,222,128,' + (.45 * (1 - dm / 170)).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my); ctx.stroke(); }
        ctx.fillStyle = dm < 170 ? 'rgba(187,247,208,.95)' : 'rgba(191,219,254,.7)';
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
      }
    };
    const langkah = () => {
      if (!canvas.isConnected) { ro && ro.disconnect(); return; }
      for (const p of pts) {
        const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy);
        if (d < 110 && d > 0) { p.x += dx / d * .9; p.y += dy / d * .9; }     // menghindar pelan dari kursor
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      gambar();
      requestAnimationFrame(langkah);
    };
    const ro = window.ResizeObserver ? new ResizeObserver(() => { ukur(); if (kurangGerak()) gambar(); }) : null;
    ukur();
    if (ro) ro.observe(host);
    host.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse') return; const r = host.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; }, { passive: true });
    host.addEventListener('pointerleave', () => { mx = my = -9999; });
    if (kurangGerak()) gambar(); else requestAnimationFrame(langkah);
  }

  // ---------------- Teks mengetik ----------------
  function ketik(el, kalimat) {
    if (!el) return;
    if (kurangGerak() || kalimat.length < 2) { el.textContent = kalimat[0] || ''; return; }
    let k = 0, i = 0, hapus = false;
    const jalan = () => {
      if (!el.isConnected) return;
      const s = kalimat[k];
      el.textContent = s.slice(0, i);
      let jeda = hapus ? 22 : 48 + Math.random() * 40;
      if (!hapus && i === s.length) { hapus = true; jeda = 2200; }
      else if (hapus && i === 0) { hapus = false; k = (k + 1) % kalimat.length; jeda = 380; }
      i += hapus ? -1 : 1;
      if (i < 0) i = 0;
      setTimeout(jalan, jeda);
    };
    jalan();
  }

  // ---------------- Parallax & sorot ----------------
  function parallax(login) {
    if (kurangGerak()) return;
    let raf = 0, tx = 0, ty = 0;
    login.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2;
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; login.style.setProperty('--px', tx.toFixed(3)); login.style.setProperty('--py', ty.toFixed(3)); });
    }, { passive: true });
  }
  function sorot(card) {
    card.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px'); card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }, { passive: true });
  }
  function riak(btn) {
    btn.addEventListener('pointerdown', (e) => {
      if (kurangGerak()) return;
      const r = btn.getBoundingClientRect(), s = document.createElement('span'), d = Math.max(r.width, r.height) * 2;
      s.className = 'riak'; s.style.width = s.style.height = d + 'px';
      s.style.left = (e.clientX - r.left - d / 2) + 'px'; s.style.top = (e.clientY - r.top - d / 2) + 'px';
      btn.appendChild(s); setTimeout(() => s.remove(), 650);
    });
  }

  // ---------------- Konfeti ----------------
  function konfeti(dari) {
    if (kurangGerak() || !dari) return;
    const r = dari.getBoundingClientRect(), box = document.createElement('div');
    box.className = 'konfeti'; box.style.left = (r.left + r.width / 2) + 'px'; box.style.top = (r.top + r.height / 2) + 'px';
    const warna = ['var(--primary)', '#4ADE80', '#F59E0B', '#F472B6', '#38BDF8', '#A78BFA'];
    for (let i = 0; i < 34; i++) {
      const s = document.createElement('i'), sudut = Math.random() * Math.PI * 2, jarak = 70 + Math.random() * 140;
      s.style.setProperty('--tx', (Math.cos(sudut) * jarak).toFixed(0) + 'px');
      s.style.setProperty('--ty', (Math.sin(sudut) * jarak * .7 - 60).toFixed(0) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      s.style.background = warna[i % warna.length];
      s.style.animationDelay = (Math.random() * 80).toFixed(0) + 'ms';
      if (i % 3 === 0) s.style.borderRadius = '50%';
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 1300);
  }

  /** Pasang semua efek. Mengembalikan pengendali untuk app.js. */
  function pasang(root, opsi) {
    opsi = opsi || {};
    const login = root.querySelector('.login'), card = root.querySelector('.login-card');
    jaring(root.querySelector('.lg-net'));
    ketik(root.querySelector('#lType'), opsi.kalimat || []);
    if (login) parallax(login);
    if (card && pakaiMouse()) sorot(card);
    const btn = root.querySelector('#lBtn'); if (btn) riak(btn);
    const owl = maskot(root);
    return {
      owl,
      peran(p) { owl && owl.peran(p); },
      gagal() {
        owl && owl.sedih();
        if (card && !kurangGerak()) { card.classList.remove('goyang'); void card.offsetWidth; card.classList.add('goyang'); }
      },
      sukses() { owl && owl.senang(1600); konfeti(btn); },
      jeda: () => kurangGerak() ? 0 : 650
    };
  }

  window.LoginFX = { owlSvg, pasang, konfeti };
})();

/* ==================================================================
   APP — router hash, layar login, sesi, ganti sandi
   ================================================================== */
(function () {
  'use strict';
  const { ic, esc, toast } = UI;
  const KAPP = 'sc_app';

  const App = {
    app: null,
    pengaturan() { if (!this.app) { try { this.app = JSON.parse(localStorage.getItem(KAPP) || 'null'); } catch (e) { this.app = null; } } return this.app || { nama_app: 'Syarifah Course', tagline: 'Bimbingan Belajar Digital' }; },
    setApp(app) { if (!app) return; this.app = app; try { localStorage.setItem(KAPP, JSON.stringify(app)); } catch (e) { /* */ } UI.terapkanTema(app); },

    init() {
      if (!API.konfigValid()) { renderSetup(); return; }
      if (window.SC_BOOT) this.setApp(window.SC_BOOT);      // versi GAS: pengaturan sudah disisipkan server → tanpa jeda
      UI.terapkanTema(this.pengaturan());
      API.setOnAuthHilang((msg) => App.sesiBerakhir(msg));
      window.addEventListener('hashchange', route);
      route();
      if (!window.SC_BOOT) API.api('app.publik').then((r) => {
        if (!r.success) return;
        const lama = JSON.stringify(App.app);
        App.setApp(r.data);
        if (!API.Sesi.me() && lama !== JSON.stringify(r.data)) renderLogin();
      });
    },
    sesiBerakhir(msg) {
      if (!API.Sesi.me()) return;
      API.Sesi.hapus();
      toast(msg || 'Sesi Anda berakhir. Silakan masuk lagi.', 'warning');
      location.hash = '#/masuk';
      route();
    },
    async keluar(semua) {
      if (semua) {
        const ok = await UI.konfirmasi('Keluar dari semua perangkat?', 'Semua sesi akun Anda di HP/laptop lain juga akan berakhir.', { ok: 'Keluar semua', bahaya: true });
        if (!ok) return;
        await API.api('auth.keluarSemua', {});
      }
      API.Sesi.hapus();
      location.hash = '#/masuk';
      route();
    },
    /** Modal ganti kata sandi. wajib=true → tidak bisa ditutup sebelum diganti. */
    modalGantiSandi(wajib) {
      const m = UI.buka(UI.headHtml(wajib ? 'Buat kata sandi baru' : 'Ubah kata sandi', wajib ? 'Demi keamanan, ganti kata sandi awal dari pengelola.' : '') +
        '<form class="modal-body stack" id="fGanti" novalidate>' +
        fieldSandi('gLama', wajib ? 'Kata sandi saat ini (dari pengelola)' : 'Kata sandi lama', 'current-password') +
        fieldSandi('gBaru', 'Kata sandi baru', 'new-password', 'Minimal 8 karakter, berisi huruf dan angka.') +
        fieldSandi('gUlang', 'Ulangi kata sandi baru', 'new-password') +
        '<p class="err hidden" id="gErr" role="alert"></p>' +
        '<button class="btn btn-primary btn-block btn-lg" type="submit">' + ic('key', 18) + ' Simpan kata sandi</button>' +
        (wajib ? '<button class="btn btn-ghost btn-block" type="button" data-close>Nanti saja</button>' : '') +
        '</form>', { label: 'Ubah kata sandi' });
      pasangMata(m.el);
      m.el.querySelector('#fGanti').addEventListener('submit', async (e) => {
        e.preventDefault();
        const lama = m.el.querySelector('#gLama').value, baru = m.el.querySelector('#gBaru').value, ulang = m.el.querySelector('#gUlang').value;
        const err = m.el.querySelector('#gErr');
        const tampil = (t) => { err.innerHTML = ic('alert', 16) + ' ' + esc(t); err.classList.remove('hidden'); err.className = 'err'; };
        if (baru.length < 8 || !/[A-Za-z]/.test(baru) || !/\d/.test(baru)) return tampil('Kata sandi baru minimal 8 karakter dan berisi huruf serta angka.');
        if (baru !== ulang) return tampil('Ulangan kata sandi tidak sama.');
        const btn = e.submitter || m.el.querySelector('[type=submit]');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Menyimpan…';
        const s = API.Sesi.baca();
        const r = await API.api('auth.gantiSandi', { lama, baru, ingat: s && s.ingat });
        btn.disabled = false; btn.innerHTML = ic('key', 18) + ' Simpan kata sandi';
        if (!r.success) return tampil(r.message);
        if (r.data && r.data.token) API.Sesi.perbaruiToken(r.data.token);
        API.Sesi.perbaruiMe({ wajibGanti: false });
        toast(r.message || 'Kata sandi diganti.', 'success');
        m.tutup();
      });
    }
  };
  window.App = App;

  function fieldSandi(id, label, ac, hint) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><div class="input-wrap">' + ic('lock', 20) +
      '<input class="input" type="password" id="' + id + '" autocomplete="' + ac + '" required><button type="button" class="icon-btn light trail" data-mata="' + id + '" aria-label="Tampilkan kata sandi">' + ic('eye', 20) + '</button></div>' +
      (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</div>';
  }
  function pasangMata(root) {
    root.querySelectorAll('[data-mata]').forEach((b) => b.addEventListener('click', () => {
      const i = root.querySelector('#' + b.dataset.mata), lihat = i.type === 'password';
      i.type = lihat ? 'text' : 'password';
      b.innerHTML = ic(lihat ? 'eyeOff' : 'eye', 20);
      b.setAttribute('aria-label', lihat ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    }));
  }
  App.pasangMata = pasangMata;
  App.fieldSandi = fieldSandi;

  // ---------------- Router ----------------
  function route() {
    const me = API.Sesi.me();
    const bagian = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    if (!me) { if (bagian[0] && bagian[0] !== 'masuk') history.replaceState(null, '', '#/masuk'); renderLogin(); return; }
    if (me.peran === 'siswa') {
      if (bagian[0] !== 'siswa') { location.replace('#/siswa/beranda'); return; }
      document.body.className = 'mode-siswa';
      Siswa.route(bagian.slice(1).length ? bagian.slice(1) : ['beranda']);
    } else {
      if (bagian[0] !== 'guru') { location.replace('#/guru/dashboard'); return; }
      document.body.className = 'mode-guru';
      Guru.route(bagian.slice(1).length ? bagian.slice(1) : ['dashboard']);
    }
    if (me.wajibGanti && !App._sudahMinta) { App._sudahMinta = true; setTimeout(() => App.modalGantiSandi(true), 700); }
  }
  App.route = route;

  // ---------------- Layar setup (config.js belum diisi) ----------------
  function renderSetup() {
    document.body.className = '';
    document.getElementById('app').innerHTML = '<div class="setup"><div class="card stack">' +
      '<div class="empty" style="padding:0"><div class="art">' + ic('settings', 32) + '</div></div>' +
      '<h2>Konfigurasi belum lengkap</h2>' +
      '<p class="muted">Aplikasi belum tersambung ke server Google Apps Script. Buka berkas <b>js/config.js</b> lalu isi <b>GAS_URL</b> dengan URL Web App yang berakhiran <code>/exec</code>.</p>' +
      '<div class="info-box">' + ic('info', 18) + '<span>Langkah lengkap ada di <b>PANDUAN-INSTALASI.md</b> bagian “Hubungkan frontend”.</span></div></div></div>';
  }

  // ---------------- Layar masuk ----------------
  let peranLogin = 'siswa';
  function renderLogin() {
    document.body.className = 'mode-login';
    const app = App.pengaturan();
    API.warmUp('pub');
    // simpan isian bila layar dirender ulang (mis. pengaturan aplikasi baru selesai dimuat)
    const lamaUser = document.getElementById('lUser'), lamaPass = document.getElementById('lPass'), lamaIngat = document.getElementById('lIngat');
    const simpanan = lamaUser ? { u: lamaUser.value, p: lamaPass.value, i: lamaIngat.checked, fokus: document.activeElement && document.activeElement.id } : null;
    const demo = app.demo && app.demo.akun && app.demo.akun.length ? app.demo : null;
    const sapa = (() => { const j = new Date().getHours(); return j < 11 ? 'Selamat pagi' : j < 15 ? 'Selamat siang' : j < 18 ? 'Selamat sore' : 'Selamat malam'; })();
    const intro = Date.now() - (App._loginRender || 0) > 4000;      // animasi masuk hanya sekali (bukan saat render ulang)
    App._loginRender = Date.now();
    const kata = esc(app.nama_app).split(' ').map((k, i) => '<span class="kata" style="--d:' + (i * 90 + 250) + 'ms">' + k + '</span>').join(' ');
    const node = (cls, isi) => '<span class="node ' + cls + '">' + isi + '</span>';
    document.getElementById('app').innerHTML =
      '<main class="login' + (intro ? ' intro' : '') + '">' +
        '<canvas class="lg-net" aria-hidden="true"></canvas>' +
        '<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>' +
        '<section class="login-hero">' +
          '<span class="access-pill"><i></i> ' + (demo ? 'Versi Demo • Silakan Dicoba' : 'Akses Tertutup • Khusus Terdaftar') + '</span>' +
          '<div class="stage px" style="--d:10">' +
            '<div class="orbit o2">' + node('n1', ic('book', 16)) + node('n2', ic('trophy', 16)) + node('n3', '<b>π</b>') + node('n4', ic('quiz', 16)) + '</div>' +
            '<div class="orbit o1">' + node('n1', ic('star', 14)) + node('n3', '<b>x²</b>') + '</div>' +
            '<div class="logo-tile">' + (app.logo_url ? UI.logoHtml(app, 'mono') : '<span class="mono">' + esc(UI.fmt.inisial(app.nama_app).slice(0, 1)) + '<b>' + esc(UI.fmt.inisial(app.nama_app).slice(1, 2)) + '</b></span>') +
              '<span class="cap">' + ic('cap', 18) + '</span></div>' +
            '<div class="fc-wrap fa px" style="--d:26" aria-hidden="true"><div class="fc"><span class="fc-ic g">' + ic('trend', 18) + '</span><div><small>Nilai latihan</small><b>92 <em>+8</em></b></div>' +
              '<span class="fc-bars"><i style="--h:40%"></i><i style="--h:62%"></i><i style="--h:50%"></i><i style="--h:78%"></i><i style="--h:92%"></i></span></div></div>' +
            '<div class="fc-wrap fb px" style="--d:-22" aria-hidden="true"><div class="fc"><svg class="fc-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="v" cx="18" cy="18" r="15" pathLength="100"/></svg><div><small>Kehadiran</small><b>8/8 sesi</b></div></div></div>' +
          '</div>' +
          '<h1 class="kilap">' + kata + '</h1>' +
          '<p class="typer" aria-hidden="true"><span id="lType"></span><i class="caret"></i></p><p class="sr-only">' + esc(app.tagline || '') + '</p>' +
          '<div class="login-points"><div style="--d:700ms">' + ic('book', 22) + ' Materi & modul PDF dari pengajar</div><div style="--d:820ms">' + ic('quiz', 22) + ' Latihan soal dengan nilai otomatis</div><div style="--d:940ms">' + ic('clipcheck', 22) + ' Pantau kehadiran, jadwal, dan tagihan</div></div>' +
        '</section>' +
        '<div class="login-side">' + LoginFX.owlSvg() +
        '<section class="login-card"><div class="login-inner">' +
          '<div class="segmented blue seg-slide" role="tablist" aria-label="Pilih jenis akun"><span class="seg-ind"></span>' +
            '<button type="button" role="tab" data-peran="siswa">' + ic('user', 18) + ' Siswa</button>' +
            '<button type="button" role="tab" data-peran="guru">' + ic('idcard', 18) + ' Guru / Pengelola</button>' +
          '</div>' +
          '<div class="l-head"><span class="sapa">' + ic('sparkle', 14) + ' ' + sapa + '!</span><h2 id="lJudul"></h2><p class="lead">' + (demo ? 'Pilih akun demo di bawah, atau ketik manual.' : 'Gunakan akun yang sudah diverifikasi oleh pengelola bimbel.') + '</p></div>' +
          (demo ? '<div class="demo-box"><div class="demo-h"><b>' + ic('play', 16) + ' Masuk cepat dengan akun demo</b><span>Sandi: <code>' + esc(demo.sandi) + '</code></span></div><div class="demo-akun">' +
            demo.akun.map((a, i) => '<button type="button" data-demo="' + i + '"><span class="da-ic">' + ic(a.label === 'Admin' ? 'shield' : a.label === 'Guru' ? 'idcard' : 'user', 18) + '</span><b>' + esc(a.label) + '</b><small>' + esc(a.ket) + '</small></button>').join('') +
            '</div></div>' : '') +
          '<form id="fLogin" class="stack" novalidate>' +
            '<div class="field"><label for="lUser" id="lUserLbl"></label><div class="input-wrap" id="lUserWrap"></div></div>' +
            '<div class="field"><label for="lPass">Kata Sandi</label><div class="input-wrap">' + ic('lock', 20) +
              '<input class="input" type="password" id="lPass" autocomplete="current-password" placeholder="Masukkan kata sandi" required>' +
              '<button type="button" class="icon-btn light trail" data-mata="lPass" aria-label="Tampilkan kata sandi">' + ic('eye', 20) + '</button></div>' +
              '<span class="caps hidden" id="lCaps" role="status">' + ic('alert', 14) + ' Caps Lock sedang aktif</span></div>' +
            '<div class="row between"><label class="check"><input type="checkbox" id="lIngat"> Ingat Sesi Saya</label>' +
              '<button type="button" class="btn btn-ghost btn-sm" id="lLupa">Lupa kata sandi?</button></div>' +
            '<p class="err hidden" id="lErr" role="alert"></p>' +
            '<button class="btn btn-primary btn-block btn-lg btn-login" type="submit" id="lBtn"><span class="lbl">Masuk Sekarang ' + ic('right', 20) + '</span></button>' +
          '</form>' +
          (demo ? '<p class="demo-note">' + ic('refresh', 14) + ' ' + esc(demo.reset) + '</p>'
            : '<div class="login-help"><span>Belum memiliki akun bimbingan?</span><button class="btn btn-ghost btn-sm" id="lAktivasi">' + ic('headset', 16) + ' Hubungi Admin</button></div>') +
          '<p class="login-foot">' + ic('shield', 16) + ' Data tersimpan di Google Workspace milik ' + esc(app.nama_app) + '</p>' +
        '</div></section></div>' +
      '</main>';
    const root = document.getElementById('app');
    pasangMata(root);
    const fx = LoginFX.pasang(root, { kalimat: [app.tagline || 'Bimbingan Belajar Digital', 'Materi & modul bisa dibuka kapan saja.', 'Latihan soal dengan nilai otomatis.', 'Pantau jadwal, kehadiran, dan tagihan.'] });
    const polaUser = (p, v) => p === 'siswa' ? /^[A-Za-z0-9._-]{4,}$/.test(v) : /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const cekUser = () => { const u = root.querySelector('#lUser'); root.querySelector('#lUserWrap').classList.toggle('valid', polaUser(peranLogin, u.value.trim())); };
    const setPeran = (p, awal) => {
      peranLogin = p;
      root.querySelectorAll('[data-peran]').forEach((b) => { const on = b.dataset.peran === p; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
      root.querySelector('.seg-slide').style.setProperty('--i', p === 'siswa' ? 0 : 1);
      root.querySelector('#lJudul').textContent = p === 'siswa' ? 'Masuk ke Akun Siswa' : 'Masuk sebagai Guru';
      root.querySelector('#lUserLbl').textContent = p === 'siswa' ? 'ID Siswa Bimbel' : 'Email Guru';
      const lama = root.querySelector('#lUser'), nilai = lama ? lama.value : '';
      root.querySelector('#lUserWrap').innerHTML = ic(p === 'siswa' ? 'idcard' : 'mail', 20) +
        '<input class="input" id="lUser" ' + (p === 'siswa' ? 'autocapitalize="characters" autocomplete="username" placeholder="Contoh: SC26001"' : 'type="email" autocomplete="username" inputmode="email" placeholder="nama@email.com"') + ' required>' +
        '<span class="ok-mark" aria-hidden="true">' + ic('check', 14) + '</span>';
      root.querySelector('#lUser').value = nilai; cekUser();
      root.querySelector('#lUser').addEventListener('input', cekUser);
      root.querySelector('#lErr').classList.add('hidden');
      if (!awal) { const h = root.querySelector('.l-head'); h.classList.remove('ganti'); void h.offsetWidth; h.classList.add('ganti'); }
      fx.peran(p);
      if (p === 'guru') API.warmUp('guru');
    };
    root.querySelectorAll('[data-peran]').forEach((b) => b.addEventListener('click', () => setPeran(b.dataset.peran)));
    setPeran(peranLogin, true);
    const caps = (e) => { if (e.getModifierState) root.querySelector('#lCaps').classList.toggle('hidden', !e.getModifierState('CapsLock')); };
    root.querySelector('#lPass').addEventListener('keydown', caps);
    root.querySelector('#lPass').addEventListener('keyup', caps);
    root.querySelector('#lPass').addEventListener('blur', () => root.querySelector('#lCaps').classList.add('hidden'));
    if (simpanan) {
      root.querySelector('#lUser').value = simpanan.u; root.querySelector('#lPass').value = simpanan.p; root.querySelector('#lIngat').checked = simpanan.i; cekUser();
      if (simpanan.fokus && root.querySelector('#' + simpanan.fokus)) root.querySelector('#' + simpanan.fokus).focus();
    }
    const bantuan = () => UI.buka(UI.headHtml('Butuh bantuan akun?') + '<div class="modal-body stack"><p class="muted">Akun dan kata sandi dibuat oleh pengelola bimbel. Untuk aktivasi akun baru atau reset kata sandi, hubungi pengelola:</p>' +
      (app.kontak_admin ? '<div class="cred"><span>' + esc(app.kontak_admin) + '</span></div>' : '<div class="info-box">' + ic('info', 18) + '<span>Hubungi pengelola bimbel secara langsung di tempat les.</span></div>') +
      '</div><div class="modal-foot"><button class="btn btn-primary" data-close>Mengerti</button></div>');
    root.querySelector('#lLupa').addEventListener('click', bantuan);
    if (root.querySelector('#lAktivasi')) root.querySelector('#lAktivasi').addEventListener('click', bantuan);
    root.querySelectorAll('[data-demo]').forEach((b) => b.addEventListener('click', () => {      // versi demo: isi & masuk sekali klik
      const a = demo.akun[+b.dataset.demo]; if (!a) return;
      root.querySelectorAll('[data-demo]').forEach((x) => x.classList.toggle('on', x === b));
      setPeran(a.peran);
      root.querySelector('#lUser').value = a.username; root.querySelector('#lPass').value = demo.sandi; cekUser();
      root.querySelector('#fLogin').requestSubmit();
    }));
    root.querySelector('#fLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = root.querySelector('#lUser').value.trim(), pass = root.querySelector('#lPass').value;
      const err = root.querySelector('#lErr'), btn = root.querySelector('#lBtn');
      const tampil = (t) => { err.innerHTML = ic('alert', 16) + ' ' + esc(t); err.className = 'err'; };
      if (!user || !pass) { tampil(peranLogin === 'siswa' ? 'Isi ID Siswa dan kata sandi.' : 'Isi email dan kata sandi.'); fx.gagal(); (user ? root.querySelector('#lPass') : root.querySelector('#lUser')).focus(); return; }
      btn.disabled = true; btn.innerHTML = '<span class="lbl"><span class="spinner"></span> Memeriksa…</span>';
      const ingat = root.querySelector('#lIngat').checked;
      const r = await API.api('auth.login', { peran: peranLogin, username: user, password: pass, ingat });
      if (!r.success) {
        btn.disabled = false; btn.innerHTML = '<span class="lbl">Masuk Sekarang ' + ic('right', 20) + '</span>';
        tampil(r.message); fx.gagal(); root.querySelector('#lPass').select(); return;
      }
      btn.classList.add('ok'); btn.innerHTML = '<span class="lbl">' + ic('checkCircle', 20) + ' Berhasil! Mengalihkan…</span>';
      err.className = 'err hidden'; fx.sukses();
      await new Promise((ok) => setTimeout(ok, fx.jeda()));
      API.Sesi.simpan(r.data.token, r.data.me, ingat);
      App._sudahMinta = false;
      location.hash = r.data.me.peran === 'siswa' ? '#/siswa/beranda' : '#/guru/dashboard';
    });
  }

  document.addEventListener('DOMContentLoaded', () => App.init());
})();

</script>
</body>
</html>
